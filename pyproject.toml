[project]
name = "shodak"
version = "0.1.0"
description = "A multi-agent research and personalized writing system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Krishna Sai Joga" }
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"