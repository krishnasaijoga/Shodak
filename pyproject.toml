[project]
name = "shodak"
version = "0.1.0"
description = "A multi-agent research and personalized writing system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Krishna Sai Joga" }
]
dependencies = [
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[project.scripts]
shodak = "shodak.main:main"